apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: marketing-site-prd
  labels:
    cloud.googleapis.com/location: "us-central1"
  annotations:
    run.googleapis.com/ingress: "internal-and-cloud-load-balancing"
    run.googleapis.com/ingress-status: "internal-and-cloud-load-balancing"
    run.googleapis.com/launch-stage: "BETA"
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        run.googleapis.com/sandbox: "gvisor"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 900
      serviceAccountName: marketing-site@example-prd.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/example-prd/apps/marketing-site:abc123
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: 2000m
              memory: 1024Mi
          env:
            - name: CMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cms-api-key-prd
                  key: latest
            - name: CMS_BASE_URL
              value: "https://cms.example.com"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://app.example.com"
            - name: NEXT_PUBLIC_BASE_API_URL
              value: "https://api.example.com"
            - name: NEXT_PUBLIC_GTM_ID
              value: "GTM-XXXX"
            - name: NODE_ENV
              value: "production"
  traffic:
    - latestRevision: true
      percent: 100
