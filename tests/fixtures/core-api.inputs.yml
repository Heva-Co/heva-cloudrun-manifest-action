kind: service
name: core-api-prd
region: us-central1
image: us-central1-docker.pkg.dev/example-prd/apps/core-api:abc123
service-account: core-api@example-prd.iam.gserviceaccount.com
environment: prd
traffic: latest
port: "8000"
cpu: 2000m
memory: 1024Mi
concurrency: "30"
timeout: "900"
ingress: all
invoker-iam-disabled: "true"
launch-stage: BETA
execution-environment: gen2
min-instances: "1"
max-instances: "100"
vpc-network: default
vpc-subnetwork: default
vpc-egress: private-ranges-only
cloudsql-instances: example-prd:us-central1:main-db
startup-probe: path=/health/liveness,initial-delay=10,timeout=10,period=10,failure-threshold=240
env-plain: |
  GOOGLE_CLOUD_PROJECT=example-prd
  APP_ENV=prd
  PARAMETER_MANAGER_CONFIG_NAME=core-api-config-prd
  ENABLE_SMS_CHANNEL=true
  SMS_OUTBOUND_DAILY_WARN=400
  SMS_OUTBOUND_DAILY_CAP=0
  DENIAL_BREAKER_ENABLED=true
  DENIAL_BREAKER_SHADOW=false
  ALLOWED_ORIGINS=https://app.example.com,https://partners.example.com
  GRAPHDB_USERNAME=core-api
env-secrets: |
  JWT_SECRET_KEY=core-api-jwt-secret-key-prd
  GUEST_JWT_SECRET_KEY=core-api-guest-jwt-secret-key-prd
  CIPHER_SECRET_KEY=core-api-cipher-secret-key-prd
  ENCRYPTION_KEY=core-api-encryption-key-prd
  PAYMENTS_SECRET_KEY=payments-secret-key-prd
  PAYMENTS_WEBHOOK_SECRET=core-api-payments-webhook-secret-prd
  SMS_AUTH_TOKEN=sms-auth-token-prd
  STORAGE_ACCESS_KEY=storage-access-key-prd
  STORAGE_SECRET_KEY=storage-secret-key-prd
  GRAPHDB_PASSWORD=graphdb-password-prd
  MAILER_API_KEY=mailer-api-key
