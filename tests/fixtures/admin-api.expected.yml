apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: admin-api-prd
  labels:
    cloud.googleapis.com/location: "us-central1"
  annotations:
    run.googleapis.com/ingress: "internal-and-cloud-load-balancing"
    run.googleapis.com/ingress-status: "internal-and-cloud-load-balancing"
    run.googleapis.com/launch-stage: "BETA"
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
        run.googleapis.com/cloudsql-instances: "example-prd:us-central1:main-db"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/sandbox: "gvisor"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: admin-api@example-prd.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/example-prd/apps/admin-api:abc123
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: PARAMETER_MANAGER_CONFIG_NAME
              value: "admin-api-config-prd"
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100
