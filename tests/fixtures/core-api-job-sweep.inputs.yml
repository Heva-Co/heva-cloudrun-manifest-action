kind: job
name: core-api-cold-lead-sweep-prd
region: us-central1
image: us-central1-docker.pkg.dev/example-prd/apps/core-api:abc123
service-account: core-api@example-prd.iam.gserviceaccount.com
environment: prd
cpu: 1000m
memory: 512Mi
command: ./app
args: |
  jobs
  cold-lead-sweep
parallelism: "1"
task-count: "1"
max-retries: "1"
timeout: "3600"
execution-environment: gen2
vpc-network: default
vpc-subnetwork: default
vpc-egress: private-ranges-only
cloudsql-instances: example-prd:us-central1:main-db
env-plain: |
  GOOGLE_CLOUD_PROJECT=example-prd
  APP_ENV=prd
  PARAMETER_MANAGER_CONFIG_NAME=core-api-config-prd
  COLD_LEAD_INACTIVITY_HOURS=48
  COLD_LEAD_SWEEP_WORKERS=16
  COLD_LEAD_SWEEP_BATCH_SIZE=500
env-secrets: |
  JWT_SECRET_KEY=core-api-jwt-secret-key-prd
  ENCRYPTION_KEY=core-api-encryption-key-prd
