apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: core-api-prd
  labels:
    cloud.googleapis.com/location: "us-central1"
  annotations:
    run.googleapis.com/ingress: "all"
    run.googleapis.com/ingress-status: "all"
    run.googleapis.com/launch-stage: "BETA"
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
        run.googleapis.com/cloudsql-instances: "example-prd:us-central1:main-db"
        run.googleapis.com/execution-environment: "gen2"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
    spec:
      containerConcurrency: 30
      timeoutSeconds: 900
      serviceAccountName: core-api@example-prd.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/example-prd/apps/core-api:abc123
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: 2000m
              memory: 1024Mi
          env:
            - name: ALLOWED_ORIGINS
              value: "https://app.example.com,https://partners.example.com"
            - name: APP_ENV
              value: "prd"
            - name: CIPHER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: core-api-cipher-secret-key-prd
                  key: latest
            - name: DENIAL_BREAKER_ENABLED
              value: "true"
            - name: DENIAL_BREAKER_SHADOW
              value: "false"
            - name: ENABLE_SMS_CHANNEL
              value: "true"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: core-api-encryption-key-prd
                  key: latest
            - name: GOOGLE_CLOUD_PROJECT
              value: "example-prd"
            - name: GRAPHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphdb-password-prd
                  key: latest
            - name: GRAPHDB_USERNAME
              value: "core-api"
            - name: GUEST_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: core-api-guest-jwt-secret-key-prd
                  key: latest
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: core-api-jwt-secret-key-prd
                  key: latest
            - name: MAILER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mailer-api-key
                  key: latest
            - name: PARAMETER_MANAGER_CONFIG_NAME
              value: "core-api-config-prd"
            - name: PAYMENTS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-secret-key-prd
                  key: latest
            - name: PAYMENTS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-api-payments-webhook-secret-prd
                  key: latest
            - name: SMS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sms-auth-token-prd
                  key: latest
            - name: SMS_OUTBOUND_DAILY_CAP
              value: "0"
            - name: SMS_OUTBOUND_DAILY_WARN
              value: "400"
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: storage-access-key-prd
                  key: latest
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: storage-secret-key-prd
                  key: latest
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 240
  traffic:
    - latestRevision: true
      percent: 100
