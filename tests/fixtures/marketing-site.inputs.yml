kind: service
name: marketing-site-prd
region: us-central1
image: us-central1-docker.pkg.dev/example-prd/apps/marketing-site:abc123
service-account: marketing-site@example-prd.iam.gserviceaccount.com
environment: prd
traffic: latest
port: "8000"
cpu: 2000m
memory: 1024Mi
concurrency: "100"
timeout: "900"
ingress: internal-and-cloud-load-balancing
invoker-iam-disabled: "true"
launch-stage: BETA
sandbox: gvisor
min-instances: "1"
max-instances: "100"
env-plain: |
  NODE_ENV=production
  NEXT_PUBLIC_BASE_API_URL=https://api.example.com
  NEXT_PUBLIC_GTM_ID=GTM-XXXX
  NEXT_PUBLIC_APP_URL=https://app.example.com
  CMS_BASE_URL=https://cms.example.com
env-secrets: |
  CMS_API_KEY=cms-api-key-prd
