kind: service
name: internal-portal-dev
region: us-central1
image: us-central1-docker.pkg.dev/example-internal/apps/internal-portal:abc123
service-account: internal-portal@example-internal.iam.gserviceaccount.com
environment: dev
traffic: latest
port: "8080"
cpu: 1000m
memory: 512Mi
concurrency: "80"
ingress: internal-and-cloud-load-balancing
invoker-iam-disabled: "true"
env-plain: |
  NODE_ENV=production
  TRACKER_CLOUD_ID=0a1b2c3d-4e5f-6789-abcd-ef0123456789
env-secrets: |
  TRACKER_INTAKE_WEBHOOK_URL=tracker-intake-webhook-url
  TRACKER_INTAKE_WEBHOOK_SECRET=tracker-intake-webhook-secret
  TRACKER_GENERAL_WEBHOOK_URL=tracker-general-webhook-url
  TRACKER_GENERAL_WEBHOOK_SECRET=tracker-general-webhook-secret
  TRACKER_CLIENT_ID=tracker-client-id
  TRACKER_CLIENT_SECRET=tracker-client-secret
