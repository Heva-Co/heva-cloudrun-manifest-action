kind: service
name: web-app-prd
region: us-central1
image: us-central1-docker.pkg.dev/example-prd/apps/web-app:abc123
service-account: web-app@example-prd.iam.gserviceaccount.com
environment: prd
traffic: latest
port: "3000"
cpu: "1"
memory: 512Mi
concurrency: "80"
timeout: "60"
ingress: internal-and-cloud-load-balancing
invoker-iam-disabled: "true"
min-instances: "1"
max-instances: "10"
vpc-network: default
vpc-subnetwork: default
vpc-egress: private-ranges-only
startup-probe: path=/,initial-delay=5,timeout=5,period=10,failure-threshold=3
env-plain: |
  NODE_ENV=production
  ENVIRONMENT=prd
  NEXT_PUBLIC_API_URL=https://api.example.com
  NEXT_PUBLIC_GTM_ID=GTM-XXXX
  NEXT_PUBLIC_PAYMENTS_PUBLISHABLE_KEY=publishable-EXAMPLE-not-a-secret
  NEXT_PUBLIC_ANALYTICS_KEY=analytics-EXAMPLE-not-a-secret
  REDIS_HOST=10.0.0.9
  REDIS_PORT=6379
