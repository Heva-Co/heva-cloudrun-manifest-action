kind: service
name: notifier-prd
region: us-central1
image: us-central1-docker.pkg.dev/example-prd/apps/notifier:abc123
service-account: notifier@example-prd.iam.gserviceaccount.com
environment: prd
traffic: latest
port: "8080"
cpu: "2"
memory: 1024Mi
concurrency: "80"
timeout: "900"
ingress: internal-and-cloud-load-balancing
invoker-iam-disabled: "true"
launch-stage: BETA
sandbox: gvisor
cpu-throttling: "false"
min-instances: "1"
max-instances: "50"
vpc-network: default
vpc-subnetwork: default
vpc-egress: private-ranges-only
cloudsql-instances: example-prd:us-central1:main-db
env-plain: |
  PARAMETER_MANAGER_CONFIG_NAME=notifier-config-prd
  CORE_API_SOCKET_AUTH_URL=https://api.example.com/socket-auth
  RELAY_DB_USER=notifier-db
  RELAY_DB_NAME=notifier-db
  RELAY_APNS_PRODUCTION=true
  RELAY_APNS_KEY_ID=ABC123DEF4
  RELAY_APNS_TEAM_ID=TEAM123456
  RELAY_PROVIDER_TIMEOUT_MS=5000
  RELAY_DEFAULT_RATE_LIMIT_PER_MINUTE=60
env-secrets: |
  RELAY_DB_PASSWORD=notifier-db-pass-prd
  RELAY_APNS_PRIVATE_KEY=notifier-push-key-prd
  RELAY_ADMIN_TOKEN=notifier-admin-token-prd
  NOTIFICATIONS_WEBHOOK_TOKEN=notifications-webhook-token-prd
