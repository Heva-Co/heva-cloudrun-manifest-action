kind: job
name: billing-payout-prd
region: us-central1
image: us-central1-docker.pkg.dev/example-prd/apps/billing-api:abc123
service-account: billing-api@example-prd.iam.gserviceaccount.com
environment: prd
cpu: "1"
memory: 512Mi
command: ./app
args: |
  jobs
  payout
parallelism: "1"
task-count: "1"
max-retries: "0"
timeout: "900"
execution-environment: gen2
vpc-network: default
vpc-subnetwork: default
vpc-egress: private-ranges-only
cloudsql-instances: example-prd:us-central1:main-db
env-plain: |
  APP_ENV=prd
  GOOGLE_CLOUD_PROJECT=example-prd
  DB_DRIVER=postgres
  DB_HOST=10.0.0.3
  DB_PORT=5432
  DB_USER=billing-db
  DB_NAME=billing-db
  DB_GORM_LOGGER_LEVEL=silent
  BANKING_BASE_URL=https://api.banking.example.com
  BANKING_ACCOUNT_ID=cash-account-123
  BANKING_TEST_MODE=false
  BASE_URL=https://api.example.com/accounting
  MAILER_FROM_EMAIL=noreply@example.com
env-secrets: |
  DB_PASS=billing-api-db-pass-prd
  PAYMENTS_SECRET_KEY=payments-secret-key-prd
  BANKING_AUTH_TOKEN=billing-api-banking-auth-token-prd
  SERVICE_API_KEY=example-service-api-key-prd
  MAILER_API_KEY=mailer-api-key
