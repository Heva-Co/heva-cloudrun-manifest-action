kind: service
name: inference-api-prd
region: us-central1
image: us-central1-docker.pkg.dev/example-prd/apps/inference-api:abc123
service-account: inference-api@example-prd.iam.gserviceaccount.com
environment: prd
traffic: latest
port: "8000"
cpu: "4"
memory: 4Gi
concurrency: "20"
timeout: "900"
ingress: internal-and-cloud-load-balancing
invoker-iam-disabled: "true"
launch-stage: BETA
sandbox: gvisor
min-instances: "1"
max-instances: "20"
custom-audiences: |
  https://api.example.com/ia/*
vpc-network: default
vpc-subnetwork: default
vpc-egress: private-ranges-only
cloudsql-instances: example-prd:us-central1:main-db
env-plain: |
  APP_ENV=prd
  GOOGLE_CLOUD_PROJECT=example-prd
  DEFAULT_MODEL=claude-opus-5
  DB_USER=inference-api
  DB_NAME=inference-db
env-secrets: |
  DB_PASSWORD=inference-api-db-pass-prd
  LLM_API_KEY=inference-api-llm-api-key-prd
  LLM_ALT_API_KEY=inference-api-llm-alt-api-key-prd
  RERANK_API_KEY=inference-api-rerank-api-key-prd
  VECTORDB_API_KEY=inference-api-vectordb-api-key-prd
  SEARCH_API_KEY=inference-api-search-api-key-prd
  GRAPHDB_PASSWORD=graphdb-password-prd
