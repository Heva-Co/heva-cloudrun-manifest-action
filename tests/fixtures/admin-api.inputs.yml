kind: service
name: admin-api-prd
region: us-central1
image: us-central1-docker.pkg.dev/example-prd/apps/admin-api:abc123
service-account: admin-api@example-prd.iam.gserviceaccount.com
environment: prd
traffic: latest
port: "8080"
cpu: "1"
memory: 512Mi
concurrency: "80"
timeout: "300"
ingress: internal-and-cloud-load-balancing
invoker-iam-disabled: "true"
launch-stage: BETA
sandbox: gvisor
min-instances: "1"
max-instances: "10"
vpc-network: default
vpc-subnetwork: default
vpc-egress: private-ranges-only
cloudsql-instances: example-prd:us-central1:main-db
startup-probe: path=/health/liveness,initial-delay=0,timeout=5,period=5,failure-threshold=3
liveness-probe: path=/health/liveness,period=30,failure-threshold=3
readiness-probe: path=/health/liveness,timeout=5,period=15,failure-threshold=3
env-plain: |
  PARAMETER_MANAGER_CONFIG_NAME=admin-api-config-prd
