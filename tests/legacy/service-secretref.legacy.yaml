apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: TRACKER_INTAKE_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: ${TRACKER_INTAKE_WEBHOOK_URL_SECRET_ID}
                  key: latest
            - name: TRACKER_INTAKE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: ${TRACKER_INTAKE_WEBHOOK_SECRET_ID}
            - name: TRACKER_GENERAL_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: ${TRACKER_GENERAL_WEBHOOK_URL_SECRET_ID}
                  key: latest
            - name: TRACKER_GENERAL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: ${TRACKER_GENERAL_WEBHOOK_SECRET_ID}
            - name: TRACKER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ${TRACKER_CLIENT_ID_SECRET_ID}
                  key: latest
            - name: TRACKER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${TRACKER_CLIENT_SECRET_SECRET_ID}
                  key: latest
            - name: TRACKER_CLOUD_ID
              value: "${TRACKER_CLOUD_ID}"
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
      containerConcurrency: 80
