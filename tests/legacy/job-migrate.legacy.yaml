apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: $SERVICE_NAME
  labels:
    cloud.googleapis.com/location: $REGION
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/network-interfaces: $NETWORK_INTERFACES
        run.googleapis.com/vpc-access-egress: $VPC_ACCESS_EGRESS
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: $DB_INSTANCE_CONNECTION_NAME
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          containers:
          - name: $SERVICE_NAME-1
            image: $IMAGE
            command:
            - ./app
            args:
            - migrate
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: $GOOGLE_CLOUD_PROJECT
            - name: APP_ENV
              value: $APP_ENV
            - name: PARAMETER_MANAGER_CONFIG_NAME
              value: $PARAMETER_MANAGER_CONFIG_NAME
            - name: MIGRATION_LOCK_WAIT
              value: $MIGRATION_LOCK_WAIT
            resources:
              limits:
                cpu: $CPU
                memory: $MEMORY
          maxRetries: 0
          timeoutSeconds: '1800'
          serviceAccountName: $SERVICE_ACCOUNT
